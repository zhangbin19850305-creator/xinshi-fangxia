name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          pages_api() {
            method="$1"
            body="${2:-}"
            if [ -n "$body" ]; then
              code=$(curl -sS -o /tmp/pages-body.json -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Content-Type: application/json" \
                -d "$body" \
                "https://api.github.com/repos/${REPO}/pages")
            else
              code=$(curl -sS -o /tmp/pages-body.json -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPO}/pages")
            fi
            echo "$method /pages -> $code"
            python3 -c 'import json; d=json.load(open("/tmp/pages-body.json")); keys=("message","html_url","build_type","public","status","documentation_url"); print(json.dumps({k:d.get(k) for k in keys if isinstance(d, dict) and k in d}, ensure_ascii=False))'
            printf '%s' "$code" > /tmp/pages-code.txt
          }
          pages_api GET
          code=$(cat /tmp/pages-code.txt)
          if [ "$code" = "404" ]; then
            pages_api POST '{"build_type":"workflow"}'
            code=$(cat /tmp/pages-code.txt)
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then
              echo "::error::GitHub Pages is not enabled, and this token cannot create it (HTTP ${code}). A repo admin needs to open Settings → Pages and set Source to GitHub Actions: https://github.com/${REPO}/settings/pages"
              exit 1
            fi
          fi
          pages_api PUT '{"build_type":"workflow","public":true}' || true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
